name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          NODE_ENV: test
          TEST_PG_STRING: ${{ secrets.TEST_PG_STRING }}
        run: npx prisma generate

      - name: Run backend tests
        working-directory: ./backend
        env:
          TEST_PG_STRING: ${{ secrets.TEST_PG_STRING }}
        run: npx vitest run

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Build docker image
        run: docker build -t stock-core-backend ./backend
   
  frontend: 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
        
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build docker image
        run: docker build -t stock-core-frontend ./frontend

  e2e:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          NODE_ENV: test
          TEST_PG_STRING: ${{ secrets.TEST_PG_STRING }}
        run: npx prisma generate

      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:11012/api
          TEST_PG_STRING: ${{ secrets.TEST_PG_STRING }}
          DEBUG: pw:webserver
        run: npx playwright test
